<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisation La Liga</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 0;
            width: 100vw;
            overflow-x: hidden;
        }

        .grid-container {
            display: grid;
            grid-template-rows: 66vh 66vh 66vh;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            row-gap: 1px;
            background-color: #e0e0e0;
        }

        .zone {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff; /* Light green background */
        }

        #zone-1 { grid-row: 1; grid-column: 1; border-right: 1px solid #ddd; }
        #zone-2 { grid-row: 1; grid-column: 2; }
        #zone-3 { grid-row: 2; grid-column: 1 / span 2; }
        #zone-4 { grid-row: 3; grid-column: 1; border-right: 1px solid #ddd; }
        #zone-5 { grid-row: 3; grid-column: 2; }

        #efficiency-chart-container, #cards-chart-container, #bump-chart-container, #evolution-chart-container {
            background-color: transparent;
            padding: 10px;
            box-shadow: none;
            margin: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .controls {
            margin-bottom: 10px;
            background: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 0 2px 4px #0000000D;
            z-index: 10;
            position: absolute;
            top: 10px;
            left: 10px;
        }

        select {
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        #efficiency-chart, #bump-chart, #cards-chart {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        svg {
            width: 100%;
            height: 100%;
        }

        .bump-line {
            fill: none;
            stroke-width: 3px;
            stroke-linecap: round;
            transition: stroke-opacity 0.2s, stroke-width 0.2s;
            cursor: pointer;
        }

        .bump-circle {
            transition: r 0.2s;
        }

        .bump-label {
            font-size: 10px;
            font-family: sans-serif;
            pointer-events: none;
            text-shadow: 0 1px 2px #FFFFFFCC;
        }

        .tooltip {
            position: absolute;
            text-align: center;
            padding: 8px;
            font-size: 12px;
            background: #000000CC;
            color: #fff;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 2px 4px #00000033;
            z-index: 100;
        }

        .axis path,
        .axis line {
            stroke: #ccc;
        }

        .axis text {
            fill: #666;
            font-size: 12px;
        }

        #global-controls {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 10px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 60vh;
            opacity: 0.2;
            transition: opacity 0.3s ease;
        }

        #global-controls:hover, #global-controls:active {
            opacity: 1;
        }

        #global-season-slider {
            width: 8px;
            height: 100%;
            outline: none;
            cursor: pointer;
        }

        #season-display {
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
        }

        .player-oval:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2) !important;
        }

        .chart-title {
            margin: 10px 0 5px 0;
            font-size: 18px;
            color: #333;
            text-align: center;
            font-weight: 600;
            z-index: 5;
            width: 100%;
        }

        #zone-1 .chart-title,
        #zone-2 .chart-title,
        #zone-3 .chart-title,
        #zone-4 .chart-title,
        #zone-5 .chart-title {
            margin-top:-10px;            
            position: relative; /* Permet d'ajuster la position sans affecter le flux */
            top: 30px; /* Ajustez cette valeur pour monter/descendre le titre */        }
    </style>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div id="global-controls">
        <div id="season-display"><span id="global-season-label"></span></div>
        <input type="range" id="global-season-slider" min="0" max="0" step="1" style="writing-mode: vertical-lr; direction: rtl;">
    </div>

    <div class="grid-container">
        <div id="zone-1" class="zone">
            <div id="evolution-chart-container">
                <h3 class="chart-title">The Title Race</h3>
                <div id="evolution-chart"></div>
            </div>
        </div>
        <div id="zone-2" class="zone">
            <div id="circular-chart-container" style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                <h3 class="chart-title">Who Beat Whom ?</h3>
                <div id="circular-chart" style="width: 100%; height: 100%;"></div>
            </div>
        </div>
        <div id="zone-3" class="zone" style="display: flex; flex-direction: row; padding: 0;">
            <div id="zone-3-left" style="width: 20%; height: 100%; display: flex; flex-direction: column; border-right: 1px solid #ddd; background: #fff;">
                <h3 style="text-align: center; margin: 10px 0; font-size: 16px; color: #333;">Select Teams</h3>
                <div style="flex: 1; overflow-y: auto; padding: 0 10px 10px 10px;">
                    <div id="team-list" style="column-count: 2; font-size: 12px;"></div>
                </div>
            </div>
            <div id="zone-3-center" style="width: 60%; height: 100%; position: relative;">
                <div id="bump-chart-container">
                    <h3 class="chart-title">Overall Leaderboard</h3>
                    <div id="bump-chart"></div>
                </div>
            </div>
            <div id="zone-3-right" style="width: 20%; height: 100%; border-left: 1px solid #ddd; background: #fff; display: flex; flex-direction: column; align-items: center;">
                <h3 style="text-align: center; margin: 15px 0 10px 0; font-size: 16px; color: #333;">Focus On A Legacy</h3>
                <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; width: 100%; padding-bottom: 20px;">
                    <div class="player-oval" id="messi-oval" style="width: 100px; height: 140px; cursor: pointer; overflow: hidden; border-radius: 50%; border: 3px solid #ecf0f1; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s;">
                        <img src="messi.jpg" alt="Messi" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <div class="player-oval" id="ronaldo-oval" style="width: 100px; height: 140px; cursor: pointer; overflow: hidden; border-radius: 50%; border: 3px solid #ecf0f1; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s;">
                        <img src="ronaldo.jpg" alt="Ronaldo" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                </div>
            </div>
        </div>
        <div id="zone-4" class="zone">
            <div id="cards-chart-container">
                <h3 class="chart-title">Fouls & Aggressivity</h3>
                <div id="cards-chart"></div>
            </div>
        </div>
        <div id="zone-5" class="zone">
            <div id="efficiency-chart-container">
                <h3 class="chart-title">Goal Efficiency</h3>
                <div id="efficiency-chart"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
